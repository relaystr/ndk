name: format

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dart-format:
    name: Check Dart formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
      - name: Check Dart formatting
        run: dart format --set-exit-if-changed --output=none .
