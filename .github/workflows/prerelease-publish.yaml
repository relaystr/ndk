name: Prerelease - Publish packages
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package to publish"
        required: true
        type: string
      package_version:
        description: "Package version to publish and tag"
        required: true
        type: string
      commit_sha:
        description: "Release commit to publish and tag"
        required: true
        type: string

jobs:
  publish-packages:
    name: Publish packages
    permissions:
      contents: write
      id-token: write # Required for authentication using OIDC
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha }}
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:" # optional, change this to force refresh cache
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:" # optional, change this to specify the cache path
          architecture: x64 # optional, x64 or arm64
      - name: Setup Melos
        uses: bluefireteam/melos-action@v3
        with:
          melos-version: "8.3.0"
          dart-version: none

      - name: Setup Dart publishing credentials
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Publish package
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: melos publish -y --no-dry-run --scope="$PACKAGE_NAME"

      - name: Create release tag
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          if [ "$PACKAGE_NAME" = "ndk" ]; then
            release_tag="v$PACKAGE_VERSION"
          else
            release_tag="$PACKAGE_NAME-v$PACKAGE_VERSION"
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -a "$release_tag" "$COMMIT_SHA" -m "Release $release_tag"
          git push origin "$release_tag"
