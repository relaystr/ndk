name: ndk_drift
description: A Drift-based cache manager for the NDK (Nostr Development Kit) library, providing persistent SQLite storage for Nostr protocol data.
version: 0.2.0-dev.0+1
homepage: https://github.com/relaystr/ndk
repository: https://github.com/relaystr/ndk

topics:
  - nostr
  - ndk

environment:
  sdk: ^3.10.8
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  ndk: ^0.11.0-dev.0
  drift: ^2.34.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ">=2.32.1 <2.34.1"
  ndk_cache_manager_test_suite: ^1.0.1-dev.14
  build_runner: ">=2.11.0 <3.0.0"



flutter:
