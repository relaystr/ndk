name: ndk_flutter
description: "A Flutter UI package providing ready-to-use widgets."
version: 0.10.3-dev.2
repository: https://github.com/relaystr/ndk
topics:
  - ndk
  - nostr
  - widgets

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  android_intent_plus: ^6.1.0
  bip39_mnemonic: ^4.1.0
  crypto: ">=3.0.0 <4.0.0"
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ">=8.0.0 <12.0.0"
  flutter_svg: ^2.3.0
  file_picker: ">=12.3.0 <14.0.0"
  http: ">=1.0.0 <2.0.0"
  intl: ^0.20.3
  ndk: ^0.11.0-dev.2
  ndk_core: ^0.11.0-dev.2
  ndk_nip01: ^0.1.0
  ndk_nip07: ^0.1.0
  ndk_nip55: ^0.1.0
  ndk_nip82: ^0.1.0
  ndk_rust_verifier: ^0.6.0
  pretty_qr_code: ">=3.6.0 <4.0.0"
  url_launcher: ">=6.0.0 <7.0.0"
  web: ">=1.0.0 <2.0.0"
  rxdart: ^0.28.0
  shared_preferences: ^2.5.5
  ndk_cashu: ^0.1.0
  ndk_nwc: ^0.1.0
  ndk_wallets: ^0.1.0
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  ndk_event_verifier_test_suite: ^0.1.0
  flutter_lints: ^6.0.0

flutter:
  generate: true
  plugin:
    platforms:
      android:
        package: relaystr.ndk
        pluginClass: DartNdkPlugin
  assets:
    - assets/images/
