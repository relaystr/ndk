name: concord
description: >-
  Concord (CORD) protocol implementation for Dart — end-to-end encrypted
  communities and private channels over Nostr, with owner-rooted roles and
  permissions. Builds on the ndk package for transport.
version: 0.1.0-dev.1
homepage: https://github.com/relaystr/ndk
repository: https://github.com/relaystr/ndk

topics:
  - nostr
  - ndk
  - e2ee
  - groups

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  ndk: ^0.11.0-dev.1
  crypto: ^3.0.7
  convert: ^3.1.2
  meta: ">=1.10.0 <2.0.0"

dev_dependencies:
  lints: ^6.0.0
  test: any
