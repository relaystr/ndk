  web_socket_channel: '>=2.4.5 <4.0.0'
  web: '>=0.5.0 <2.0.0'

dev_dependencies:
  test: ^1.19.2
  mocktail: ^1.0.0
  lints: '>=5.0.0 <7.0.0'
